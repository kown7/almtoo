name: Deploy AlmToo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly client
        working-directory: AlmToo
        run: dotnet publish AlmToo.csproj --configuration Release --output publish

      - name: Prepare repository-scoped base path
        working-directory: AlmToo
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$PAGES_BASE_PATH" ] && [ "$PAGES_BASE_PATH" != "/" ]; then
            sed -i "s#<base href=\"/\" />#<base href=\"${PAGES_BASE_PATH%/}/\" />#" publish/wwwroot/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: AlmToo/publish/wwwroot

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
